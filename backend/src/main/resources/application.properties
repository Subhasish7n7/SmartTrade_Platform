spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}
frontend.url=${FRONTEND_URL}
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
jwt.secret=${JWT_SECRET}
serp.api.key=${SERP_API_KEY:}
serp.api.enabled=${SERP_API_ENABLED:false}
serp.api.google-domain=${SERP_API_GOOGLE_DOMAIN:google.co.in}
serp.api.gl=${SERP_API_GL:in}
serp.api.hl=${SERP_API_HL:en}
serp.api.location=${SERP_API_LOCATION:India}
pricing.refresh-window-hours=${PRICING_REFRESH_WINDOW_HOURS:168}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.temporary-tag=${CLOUDINARY_TEMPORARY_TAG:smarttrade_temp}
cloudinary.cleanup.retention-hours=${CLOUDINARY_CLEANUP_RETENTION_HOURS:72}
cloudinary.cleanup.fixed-delay-ms=${CLOUDINARY_CLEANUP_FIXED_DELAY_MS:3600000}
# Completion dispute timeout
trade.completion-confirmation-window-hours=${TRADE_COMPLETION_CONFIRMATION_WINDOW_HOURS:48}
trade.completion-monitor.fixed-delay-ms=${TRADE_COMPLETION_MONITOR_FIXED_DELAY_MS:3600000}
# Outbound email through Google Apps Script
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.relay-url=${MAIL_RELAY_URL:}
app.mail.relay-secret=${MAIL_RELAY_SECRET:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.tool.schema=DEBUG